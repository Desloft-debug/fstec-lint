# Правила для Dockerfile.
#
# Привязка мер — по приказу ФСТЭК России от 11.04.2025 N 117
# (зарегистрирован Минюстом 16.06.2025, N 82619, действует с 01.03.2026),
# который признал утратившим силу приказ N 17. Ссылки даны на пункты
# самого приказа:
#
#   * поле `measure` вида "п. 63 д)" — базовая мера защиты из пункта 63
#     Требований (17 базовых мер, подпункты а–с);
#   * поле `measure` вида "п. 34 б)" — мероприятие по защите информации
#     из пункта 34 Требований (22 мероприятия, подпункты а–х).
#
# Кодов мер вида ЗСВ.2 или УПД.4 в приказе N 117 НЕТ: они были в
# приложении к утратившему силу приказу N 17. Старая привязка сохранена
# в поле `legacy_measure` как история, а не как утверждение о
# соответствии. Детализация базовых мер до подмер выйдет в методических
# документах ФСТЭК (пункт 31 Требований); до их публикации привязка
# ведётся на уровне пунктов приказа.
#
# Для ИСПДн продолжает действовать приказ N 21 до его замены.
#
# Соответствие носит справочный характер: перед применением в реальном
# проекте сверьте привязку с вашей моделью угроз и актом классификации.

- id: D001
  title: "Образ запускается от root"
  severity: high
  measure: "п. 63 б)"
  measure_title: "Управление доступом"
  methodology: "ПД"
  methodology_title: "Обеспечение защиты информации при предоставлении привилегированного доступа"
  legacy_measure: "УПД.4 / ЗСВ.2"
  orders: "Приказ ФСТЭК №117 от 11.04.2025 (ГИС, действует с 01.03.2026, заменил №17). Для ИСПДн — приказ №21 до его замены"
  description: >
    Финальный стейдж сборки либо не содержит инструкции USER (тогда
    контейнер по умолчанию стартует от root), либо явно переключается на
    root/uid 0. Пользователь, унаследованный из другой локальной стадии
    через FROM, учитывается и нарушением не считается.
  remediation: >
    Создайте непривилегированного пользователя (RUN useradd ...) и
    переключитесь на него инструкцией USER перед CMD/ENTRYPOINT.
  target: dockerfile

- id: D002
  title: "ADD загружает файл по URL"
  severity: high
  measure: "п. 34 г)"
  measure_title: "Управление обновлениями"
  methodology: "БР"
  methodology_title: "Обеспечение разработки безопасного программного обеспечения"
  legacy_measure: "ОЦЛ.1 / АНЗ.1"
  orders: "Приказ ФСТЭК №117 от 11.04.2025 (ГИС, действует с 01.03.2026, заменил №17). Для ИСПДн — приказ №21 до его замены"
  description: >
    ADD с URL скачивает файл на этапе сборки без проверки
    контрольной суммы или подписи — при компрометации источника в
    образ попадает произвольный контент.
  remediation: >
    Используйте RUN curl/wget с явной проверкой sha256sum, либо
    подключайте зависимость через пакетный менеджер с проверкой подписи.
  target: dockerfile

- id: D003
  title: "Секрет передан через ARG"
  severity: critical
  measure: "п. 63 а)"
  measure_title: "Идентификация и аутентификация"
  methodology: "БР"
  methodology_title: "Обеспечение разработки безопасного программного обеспечения"
  legacy_measure: "ЗНИ.1 / ИАФ.1"
  orders: "Приказ ФСТЭК №117 от 11.04.2025 (ГИС, действует с 01.03.2026, заменил №17). Для ИСПДн — приказ №21 до его замены"
  description: >
    Значения ARG сохраняются в истории слоёв образа (docker history)
    и доступны всем, у кого есть доступ к образу, даже после
    удаления файла со значением из финального слоя.
  remediation: >
    Используйте BuildKit secrets (--mount=type=secret) или
    передавайте секрет во время выполнения контейнера, а не сборки.
  target: dockerfile

- id: D004
  title: "Базовый образ не закреплён по версии"
  severity: medium
  measure: "п. 34 г)"
  measure_title: "Управление обновлениями"
  methodology: "БР"
  methodology_title: "Обеспечение разработки безопасного программного обеспечения"
  legacy_measure: "ОЦЛ.1 / АНЗ.1"
  orders: "Приказ ФСТЭК №117 от 11.04.2025 (ГИС, действует с 01.03.2026, заменил №17). Для ИСПДн — приказ №21 до его замены"
  description: >
    FROM с тегом :latest или без тега не гарантирует воспроизводимость
    сборки: содержимое базового образа может измениться в любой момент.
  remediation: >
    Зафиксируйте конкретную версию или ссылайтесь на образ по
    digest: FROM image@sha256:...
  target: dockerfile

- id: D005
  title: "curl/wget передаётся напрямую в shell"
  severity: critical
  measure: "п. 34 м)"
  measure_title: "Обеспечение разработки безопасного программного обеспечения"
  methodology: "БР"
  methodology_title: "Обеспечение разработки безопасного программного обеспечения"
  legacy_measure: "ОЦЛ.1 / АНЗ.1"
  orders: "Приказ ФСТЭК №117 от 11.04.2025 (ГИС, действует с 01.03.2026, заменил №17). Для ИСПДн — приказ №21 до его замены"
  description: >
    Конструкция вида 'curl ... | sh' выполняет произвольный код с
    удалённого сервера без проверки целостности или подписи —
    компрометация источника означает выполнение кода атакующего на
    этапе сборки образа.
  remediation: >
    Скачайте скрипт отдельно, проверьте sha256sum/GPG-подпись и
    только после этого выполните его.
  target: dockerfile

- id: D006
  title: "Не задан HEALTHCHECK"
  severity: low
  measure: "п. 34 о)"
  measure_title: "Обеспечение непрерывности функционирования при нештатных ситуациях"
  methodology: "НФ"
  methodology_title: "Обеспечение непрерывности функционирования"
  legacy_measure: "ОДТ.3"
  orders: "Приказ ФСТЭК №117 от 11.04.2025 (ГИС, действует с 01.03.2026, заменил №17). Для ИСПДн — приказ №21 до его замены"
  description: >
    Без HEALTHCHECK в Dockerfile отказ приложения внутри контейнера
    не обнаруживается автоматически, если тот же контроль не задан
    отдельно в оркестраторе.
  remediation: >
    Добавьте HEALTHCHECK с командой проверки готовности приложения.
  target: dockerfile
