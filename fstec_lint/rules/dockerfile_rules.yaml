  severity: low
  measure: "п. 34 о)"
  measure_title: "Обеспечение непрерывности функционирования при нештатных ситуациях"
  submeasure: "ЗОО.3"
  submeasure_title: "Мониторинг состояния сервисов и интерфейсов"
  activity: "НФ"
  activity_title: "Непрерывность функционирования при нештатных ситуациях"
  pdn_measure: "ОДТ.3"
  pdn_measure_title: "Контроль безотказного функционирования, обнаружение и локализация отказов"
  cwe: "CWE-703"
  weakness_type: "недостатки, связанные с неправильной настройкой параметров ПО"
  orders: "Приказ ФСТЭК №117 от 11.04.2025 (ГИС, действует с 01.03.2026, заменил №17). Для ИСПДн — приказ №21 до его замены"
  description: >
    Без HEALTHCHECK в Dockerfile отказ приложения внутри контейнера
