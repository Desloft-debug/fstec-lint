# Правила для sshd_config.
#
# Привязка мер — по приказу ФСТЭК России от 11.04.2025 N 117
# (зарегистрирован Минюстом 16.06.2025, N 82619, действует с 01.03.2026),
# который признал утратившим силу приказ N 17. Ссылки даны на пункты
# самого приказа:
#
#   * поле `measure` вида "п. 63 д)" — базовая мера защиты из пункта 63
#     Требований (17 базовых мер, подпункты а–с);
#   * поле `measure` вида "п. 34 б)" — мероприятие по защите информации
#     из пункта 34 Требований (22 мероприятия, подпункты а–х).
#
# Кодов мер вида ЗСВ.2 или УПД.4 в приказе N 117 нет: такая таксономия
# осталась в приказе N 21, который действует для ИСПДн. Привязка по нему
# лежит в поле `pdn_measure`, детализация до подмер — в `submeasure` по
# методическому документу ФСТЭК от 12.04.2026.
#
# Для ИСПДн продолжает действовать приказ N 21 до его замены.
#
# Соответствие носит справочный характер: перед применением в реальном
# проекте сверьте привязку с вашей моделью угроз и актом классификации.

- id: S001
  title: "Разрешён вход root по SSH"
  severity: high
  measure: "п. 34 к)"
  measure_title: "Обеспечение защиты информации при предоставлении привилегированного доступа"
  submeasure: "УПД.2"
  submeasure_title: "Разграничение и контроль прав доступа"
  activity: "ПД"
  activity_title: "Защита информации при предоставлении привилегированного доступа"
  pdn_measure: "УПД.4"
  pdn_measure_title: "Разделение полномочий (ролей) пользователей и администраторов"
  cwe: "CWE-250"
  weakness_type: "недостатки, связанные с управлением разрешениями, привилегиями и доступом"
  orders: "Приказ ФСТЭК №117 от 11.04.2025 (ГИС, действует с 01.03.2026, заменил №17). Для ИСПДн — приказ №21 до его замены"
  description: >
    PermitRootLogin установлен в yes или without-password. Прямой вход
    под root по SSH убирает атрибуцию действий конкретному
    администратору и расширяет ущерб от компрометации пароля/ключа.
  remediation: >
    Установите PermitRootLogin no и используйте sudo от именного
    аккаунта для административных действий.
  target: sshd_config

- id: S002
  title: "Разрешена аутентификация по паролю"
  severity: medium
  measure: "п. 34 з)"
  measure_title: "Обеспечение защиты информации при удалённом доступе пользователей"
  submeasure: "ИАФ.3"
  submeasure_title: "Аутентификация пользователей"
  activity: "УД"
  activity_title: "Защита информации при удалённом доступе пользователей"
  pdn_measure: "УПД.13"
  pdn_measure_title: "Реализация защищённого удалённого доступа через внешние сети"
  cwe: "CWE-287"
  weakness_type: "недостатки, связанные с аутентификацией"
  orders: "Приказ ФСТЭК №117 от 11.04.2025 (ГИС, действует с 01.03.2026, заменил №17). Для ИСПДн — приказ №21 до его замены"
  description: >
    Доступ по паролю — односторонняя однофакторная аутентификация
    (ГОСТ Р 58833-2020, п. 6.9), то есть простая аутентификация
    (п. 3.46). По п. 7.2 она обеспечивает лишь низкий уровень доверия к
    результатам аутентификации. Практически это означает уязвимость к
    подбору и фишингу, от которых аутентификация по ключу защищает.
  remediation: >
    Установите PasswordAuthentication no и используйте только
    ключи (PubkeyAuthentication yes).
  target: sshd_config

- id: S003
  title: "Разрешён вход с пустым паролем"
  severity: critical
  measure: "п. 63 а)"
  measure_title: "Идентификация и аутентификация"
  submeasure: "ИАФ.3"
  submeasure_title: "Аутентификация пользователей"
  activity: "ПД"
  activity_title: "Защита информации при предоставлении привилегированного доступа"
  pdn_measure: "ИАФ.1"
  pdn_measure_title: "Идентификация и аутентификация пользователей — работников оператора"
  cwe: "CWE-258"
  weakness_type: "недостатки, связанные с аутентификацией"
  orders: "Приказ ФСТЭК №117 от 11.04.2025 (ГИС, действует с 01.03.2026, заменил №17). Для ИСПДн — приказ №21 до его замены"
  description: >
    PermitEmptyPasswords yes позволяет войти под учётной записью без
    пароля вовсе: аутентификационная информация отсутствует, и проверка
    соответствия предъявленного идентификатора субъекту доступа
    (ГОСТ Р 58833-2020, п. 6.3) не выполняется ни в каком виде.
  remediation: >
    Установите PermitEmptyPasswords no.
  target: sshd_config

- id: S004
  title: "Включён устаревший протокол SSH-1"
  severity: critical
  measure: "п. 63 с)"
  measure_title: "Защита каналов передачи данных и сетевого взаимодействия"
  submeasure: "ЗКС.1"
  submeasure_title: "Защита данных при передаче по каналам связи"
  activity: "УД"
  activity_title: "Защита информации при удалённом доступе пользователей"
  pdn_measure: "ЗИС.3"
  pdn_measure_title: "Защита персональных данных при передаче по каналам связи"
  cwe: "CWE-327"
  weakness_type: "недостатки, связанные с криптографическими преобразованиями (недостатки шифрования)"
  orders: "Приказ ФСТЭК №117 от 11.04.2025 (ГИС, действует с 01.03.2026, заменил №17). Для ИСПДн — приказ №21 до его замены"
  description: >
    SSH-1 содержит известные криптографические слабости и не
    обеспечивает целостность соединения на уровне протокола.
  remediation: >
    Уберите директиву Protocol или явно укажите Protocol 2.
  target: sshd_config

- id: S005
  title: "Включён X11Forwarding"
  severity: low
  measure: "п. 34 з)"
  measure_title: "Обеспечение защиты информации при удалённом доступе пользователей"
  submeasure: "ЗКС.3"
  submeasure_title: "Контроль доступа к внешним ресурсам"
  activity: "УД"
  activity_title: "Защита информации при удалённом доступе пользователей"
  pdn_measure: "УПД.13"
  pdn_measure_title: "Реализация защищённого удалённого доступа через внешние сети"
  cwe: "CWE-668"
  weakness_type: "недостатки, связанные с неправильной настройкой параметров ПО"
  orders: "Приказ ФСТЭК №117 от 11.04.2025 (ГИС, действует с 01.03.2026, заменил №17). Для ИСПДн — приказ №21 до его замены"
  description: >
    X11-форвардинг расширяет поверхность атаки без явной
    производственной необходимости на серверах.
  remediation: >
    Установите X11Forwarding no, если графические приложения через SSH не нужны.
  target: sshd_config

- id: S006
  title: "Не ограничено число попыток аутентификации"
  severity: low
  measure: "п. 63 а)"
  measure_title: "Идентификация и аутентификация"
  submeasure: "УПД.4"
  submeasure_title: "Ограничение неуспешных и нерегламентированных попыток доступа"
  activity: "ПД"
  activity_title: "Защита информации при предоставлении привилегированного доступа"
  pdn_measure: "УПД.6"
  pdn_measure_title: "Ограничение неуспешных попыток входа в информационную систему"
  cwe: "CWE-307"
  weakness_type: "недостатки, связанные с аутентификацией"
  orders: "Приказ ФСТЭК №117 от 11.04.2025 (ГИС, действует с 01.03.2026, заменил №17). Для ИСПДн — приказ №21 до его замены"
  description: >
    MaxAuthTries больше 4 позволяет проводить больше попыток подбора
    пароля в рамках одного соединения, прежде чем sshd его разорвёт.
  remediation: >
    Установите MaxAuthTries 4 или меньше, дополнительно используйте
    fail2ban/аналог для блокировки по IP.
  target: sshd_config
