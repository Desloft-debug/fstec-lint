# Правила для почтового сервера Postfix. Базовая мера п. 63 е) приказа
# ФСТЭК России N 117 «Защита сервисов электронной почты».

- id: M001
  title: "Входящие письма не проходят проверку"
  severity: high
  measure: "п. 63 е)"
  measure_title: "Защита сервисов электронной почты"
  submeasure: "ЗЭП.3"
  submeasure_title: "Защита от вредоносных вложений"
  activity: "КК"
  activity_title: "Контроль конфигураций информационных систем"
  pdn_measure: "АВЗ.1"
  pdn_measure_title: "Реализация антивирусной защиты"
  cwe: "CWE-434"
  weakness_type: "недостатки, связанные с неправильной настройкой параметров ПО"
  orders: "Приказ ФСТЭК №117 от 11.04.2025 (ГИС, действует с 01.03.2026, заменил №17). Для ИСПДн — приказ №21 до его замены"
  description: >
    В main.cf не задан ни content_filter, ни smtpd_milters, поэтому Postfix
    доставляет письма без внешней проверки. Вложения не проверяются
    антивирусом (частный показатель k34 методики оценки КЗИ). Правило
    проверяет только то, что фильтр подключён; что это за фильтр и
    проверяет ли он вложения, по main.cf не определить.
  remediation: >
    Подключите антивирусную проверку: smtpd_milters = inet:127.0.0.1:11332
    (rspamd с модулем антивируса), unix:/run/clamav-milter/clamav-milter.ctl
    (clamav-milter) или content_filter = smtp-amavis:[127.0.0.1]:10024
    (amavis). Для исходящей почты задайте также non_smtpd_milters.
  target: postfix_main
