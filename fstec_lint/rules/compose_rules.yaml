# Правила для docker-compose.yml.
#
# Правовой статус на 31.08.2026 (см. README → "Правовой статус"):
#   - Приказ ФСТЭК №21 (меры защиты ПДн) формально действует, но 24.07.2026
#     опубликован проект приказа о его полной отмене; общественное
#     обсуждение завершилось 08.08.2026, ожидаемая дата вступления в силу
#     нового порядка — 01.09.2026. На момент написания приказ ещё не
#     зарегистрирован в Минюсте.
#   - Приказ ФСТЭК №17 (защита ГИС) УТРАТИЛ СИЛУ. Его заменил приказ
#     ФСТЭК №117 от 11.04.2025 (рег. Минюст №82619 от 16.06.2025),
#     действующий с 01.03.2026. Состав мер расширен до 18 групп, поэтому
#     часть кодов мер ниже (например, ЗПИ — защита программных
#     интерфейсов/API) появилась именно в этой редакции и в старом
#     приказе №17 отсутствовала.
#
# Поле `orders` указывает, к какому(им) действующему(им) документу(ам)
# относится правило. Соответствие носит справочный характер — перед
# использованием в реальном проекте сверьте номера мер с действующей
# редакцией приказа/методического документа и вашей моделью угроз.

- id: C001
  title: "Контейнер запускается от имени root"
  severity: high
  measure: "УПД.4 / ЗСВ.2"
  measure_title: "Управление доступом субъектов к объектам доступа / Защита среды виртуализации"
  orders: "№21 (ПДн) / №117 (ГИС, действует с 01.03.2026 — заменил №17)"
  description: >
    В сервисе не задана директива 'user', процесс внутри контейнера
    выполняется от root. Компрометация приложения даёт злоумышленнику
    root-доступ внутри контейнера и упрощает выход за его пределы.
  remediation: >
    Укажите непривилегированного пользователя, например user: "1000:1000",
    либо задайте USER в Dockerfile образа.
  target: compose

- id: C002
  title: "Контейнер запущен в privileged-режиме"
  severity: critical
  measure: "ЗСВ.2 / УПД.4"
  measure_title: "Защита среды виртуализации / Управление доступом субъектов к объектам доступа"
  orders: "№21 (ПДн) / №117 (ГИС, действует с 01.03.2026 — заменил №17)"
  description: >
    privileged: true отключает практически всю изоляцию контейнера и
    даёт ему доступ ко всем устройствам и capabilities хоста.
  remediation: >
    Уберите privileged: true. Если приложению нужны отдельные привилегии —
    выдайте только необходимые capabilities через cap_add.
  target: compose

- id: C003
  title: "Добавлены опасные Linux capabilities"
  severity: high
  measure: "ЗСВ.2"
  measure_title: "Защита среды виртуализации"
  orders: "№21 (ПДн) / №117 (ГИС, действует с 01.03.2026 — заменил №17)"
  description: >
    cap_add содержит capabilities (SYS_ADMIN, NET_ADMIN, ALL и т.п.),
    позволяющие выйти за пределы контейнера или изменить сетевую
    конфигурацию хоста.
  remediation: >
    Используйте только точечные capabilities, реально необходимые
    приложению, и явно cap_drop: [ALL] по умолчанию.
  target: compose

- id: C004
  title: "Секрет в открытом виде в environment"
  severity: critical
  measure: "ЗНИ.1 / ИАФ.1"
  measure_title: "Защита машинных носителей информации / Идентификация и аутентификация"
  orders: "№21 (ПДн) / №117 (ГИС, действует с 01.03.2026 — заменил №17)"
  description: >
    Пароль, токен или ключ передаётся в открытом виде через
    environment в docker-compose.yml и попадает в историю Git,
    метаданные контейнера и docker inspect.
  remediation: >
    Используйте docker secrets (переменные вида *_FILE), внешний
    секрет-менеджер (Vault, SOPS) либо .env-файл, исключённый из
    системы контроля версий.
  target: compose

- id: C005
  title: "Публикация чувствительного порта на все интерфейсы"
  severity: high
  measure: "ЗИС.20 / УПД.4"
  measure_title: "Защита информации при взаимодействии с иными информационными системами / Управление доступом"
  orders: "№21 (ПДн) / №117 (ГИС, действует с 01.03.2026 — заменил №17)"
  description: >
    Порт СУБД или иного критичного сервиса опубликован без указания
    адреса и доступен со всех сетевых интерфейсов хоста, в том числе
    извне.
  remediation: >
    Публикуйте порт на 127.0.0.1 (например, "127.0.0.1:5432:5432")
    либо не публикуйте его вовсе, используя внутреннюю Docker-сеть.
  target: compose

- id: C006
  title: "Образ не закреплён по версии или digest"
  severity: medium
  measure: "ОЦЛ.1 / АНЗ.1"
  measure_title: "Обеспечение целостности информационной системы / Анализ уязвимостей и оперативное устранение недостатков"
  orders: "№21 (ПДн) / №117 (ГИС, действует с 01.03.2026 — заменил №17)"
  description: >
    Тег :latest или отсутствие явной версии не позволяет
    гарантировать неизменность и воспроизводимость образа при
    развёртывании и усложняет анализ уязвимостей.
  remediation: >
    Зафиксируйте конкретную версию образа или ссылайтесь на него по
    digest: image@sha256:...
  target: compose

- id: C007
  title: "network_mode: host"
  severity: critical
  measure: "ЗСВ.2 / ЗИС.20"
  measure_title: "Защита среды виртуализации / Защита информации при взаимодействии с иными информационными системами"
  orders: "№21 (ПДн) / №117 (ГИС, действует с 01.03.2026 — заменил №17)"
  description: >
    Контейнер использует сетевой стек хоста напрямую, сетевая
    изоляция между контейнером и хостом отсутствует.
  remediation: >
    Используйте bridge- или overlay-сеть и публикуйте только
    необходимые порты через ports.
  target: compose

- id: C008
  title: "Монтирование docker.sock внутрь контейнера"
  severity: critical
  measure: "ЗСВ.2 / УПД.4"
  measure_title: "Защита среды виртуализации / Управление доступом субъектов к объектам доступа"
  orders: "№21 (ПДн) / №117 (ГИС, действует с 01.03.2026 — заменил №17)"
  description: >
    Доступ к /var/run/docker.sock из контейнера фактически
    эквивалентен root-доступу к хосту.
  remediation: >
    Уберите монтирование сокета. Если контейнеру действительно нужно
    управлять Docker — используйте прокси с ограниченными правами
    (например, docker-socket-proxy).
  target: compose

- id: C009
  title: "Файловая система контейнера доступна на запись"
  severity: medium
  measure: "ОЦЛ.1"
  measure_title: "Обеспечение целостности программного обеспечения и информации"
  orders: "№21 (ПДн) / №117 (ГИС, действует с 01.03.2026 — заменил №17)"
  description: >
    Без read_only: true скомпрометированный процесс может изменить
    файлы приложения внутри контейнера, закрепиться или подменить
    исполняемые файлы.
  remediation: >
    Установите read_only: true и явно опишите tmpfs или volumes для
    директорий, куда приложению действительно нужно писать.
  target: compose

- id: C010
  title: "Не установлена опция no-new-privileges"
  severity: low
  measure: "ЗСВ.2"
  measure_title: "Защита среды виртуализации"
  orders: "№21 (ПДн) / №117 (ГИС, действует с 01.03.2026 — заменил №17)"
  description: >
    Без security_opt: no-new-privileges:true процесс в контейнере
    может повысить привилегии через setuid/setgid-бинарники.
  remediation: >
    Добавьте security_opt: ["no-new-privileges:true"] в описание
    сервиса.
  target: compose

- id: C011
  title: "Незащищённый Docker Engine API опубликован наружу"
  severity: critical
  measure: "ЗСВ.2 / ЗПИ.1"
  measure_title: "Защита среды виртуализации / Защита программных интерфейсов взаимодействия приложений (новая группа мер, введена приказом ФСТЭК №117)"
  orders: "№117 (ГИС, с 01.03.2026, группа ЗПИ отсутствовала в №17) / по аналогии применимо и к ПДн"
  description: >
    Порт 2375 или 2376 публикует Docker Engine API. Без mTLS доступ к
    нему равносилен root-доступу к хосту: через API можно запустить
    произвольный контейнер с смонтированным '/'.
  remediation: >
    Не публикуйте сокет Docker наружу. Если удалённое управление
    необходимо, используйте TCP-сокет только с включённым TLS
    (--tlsverify) и ограничением по сети/файрволу.
  target: compose

- id: C012
  title: "Не заданы ограничения ресурсов контейнера"
  severity: medium
  measure: "ОДТ.1"
  measure_title: "Обеспечение доступности информации"
  orders: "№21 (ПДн) / №117 (ГИС, действует с 01.03.2026 — заменил №17)"
  description: >
    Без mem_limit/cpus или deploy.resources.limits один
    скомпрометированный или аварийно работающий контейнер может
    исчерпать память или CPU хоста и вызвать отказ соседних сервисов.
  remediation: >
    Задайте лимиты явно, например mem_limit: 512m, cpus: "0.50" или
    deploy.resources.limits для актуальной версии Compose.
  target: compose

- id: C013
  title: "Не задан healthcheck сервиса"
  severity: low
  measure: "ОДТ.3"
  measure_title: "Обеспечение доступности информации (контроль отказов компонентов)"
  orders: "№21 (ПДн) / №117 (ГИС, действует с 01.03.2026 — заменил №17)"
  description: >
    Без healthcheck оркестратор не может автоматически определить
    отказ сервиса и перезапустить его, что увеличивает время
    простоя при инциденте.
  remediation: >
    Добавьте секцию healthcheck с командой проверки готовности
    сервиса (test/interval/timeout/retries).
  target: compose

- id: C014
  title: "Включён режим отладки в production-конфигурации"
  severity: medium
  measure: "АНЗ.1 / ЗИС.3"
  measure_title: "Анализ уязвимостей и оперативное устранение недостатков / Защита информации при передаче"
  orders: "№21 (ПДн) / №117 (ГИС, действует с 01.03.2026 — заменил №17)"
  description: >
    Переменная окружения вида *DEBUG установлена в истинное значение.
    Debug-режим большинства фреймворков раскрывает трассировки стека,
    переменные окружения и структуру приложения при ошибке.
  remediation: >
    Отключите debug-режим (DEBUG=false/0) в любом окружении, кроме
    локальной разработки, и управляйте им через профиль окружения.
  target: compose

- id: C015
  title: "Смонтирован чувствительный путь хоста"
  severity: critical
  measure: "ЗСВ.2"
  measure_title: "Защита среды виртуализации"
  orders: "№21 (ПДн) / №117 (ГИС, действует с 01.03.2026 — заменил №17)"
  description: >
    Внутрь контейнера смонтирован корень хоста или системный каталог
    (/, /etc, /proc, /sys, /var/run, /boot, /root). Это даёт
    контейнеру запись в файлы хоста и часто эквивалентно побегу из
    контейнера.
  remediation: >
    Монтируйте только конкретные файлы/каталоги, необходимые
    приложению, и не читайте/пишите системные каталоги хоста напрямую.
  target: compose
