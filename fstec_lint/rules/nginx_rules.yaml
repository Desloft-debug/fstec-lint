# Правила для nginx. Базовая мера п. 63 ж) приказа ФСТЭК России N 117
# «Защита веб-технологий», подмеры ЗВТ методического документа ФСТЭК от
# 12.04.2026.

- id: N001
  title: "Разрешены устаревшие версии TLS"
  severity: high
  measure: "п. 63 ж)"
  measure_title: "Защита веб-технологий"
  submeasure: "ЗВТ.1"
  submeasure_title: "Защита пользовательских данных"
  activity: "КК"
  activity_title: "Контроль конфигураций информационных систем"
  pdn_measure: "ЗИС.3"
  pdn_measure_title: "Защита персональных данных при передаче по каналам связи"
  cwe: "CWE-327"
  weakness_type: "недостатки, связанные с криптографическими преобразованиями (недостатки шифрования)"
  orders: "Приказ ФСТЭК №117 от 11.04.2025 (ГИС, действует с 01.03.2026, заменил №17). Для ИСПДн — приказ №21 до его замены"
  description: >
    ssl_protocols разрешает SSLv2, SSLv3, TLSv1 или TLSv1.1, либо TLS
    включён, а ssl_protocols не задан (до nginx 1.23.4 по умолчанию
    разрешены TLSv1 и TLSv1.1). Эти версии протокола уязвимы и отключены
    в современных браузерах.
  remediation: >
    Установите ssl_protocols TLSv1.2 TLSv1.3.
  target: nginx

- id: N002
  title: "Включён вывод списка файлов каталога"
  severity: medium
  measure: "п. 63 ж)"
  measure_title: "Защита веб-технологий"
  submeasure: "ЗВТ.2"
  submeasure_title: "Управление доступом пользователей"
  activity: "КК"
  activity_title: "Контроль конфигураций информационных систем"
  pdn_measure: "УПД.2"
  pdn_measure_title: "Реализация необходимых методов, типов и правил разграничения доступа"
  cwe: "CWE-548"
  weakness_type: "недостатки, приводящие к утечке/раскрытию информации ограниченного доступа"
  orders: "Приказ ФСТЭК №117 от 11.04.2025 (ГИС, действует с 01.03.2026, заменил №17). Для ИСПДн — приказ №21 до его замены"
  description: >
    autoindex on: при отсутствии индексного файла nginx показывает
    содержимое каталога, включая резервные копии и служебные файлы.
  remediation: >
    Уберите autoindex on или установите autoindex off.
  target: nginx

- id: N003
  title: "Отключена регистрация обращений"
  severity: medium
  measure: "п. 63 ж)"
  measure_title: "Защита веб-технологий"
  submeasure: "ЗВТ.4"
  submeasure_title: "Регистрация событий безопасности в веб-приложениях и реагирование на них"
  activity: "МБ"
  activity_title: "Обеспечение мониторинга информационной безопасности"
  pdn_measure: "РСБ.1"
  pdn_measure_title: "Определение событий безопасности, подлежащих регистрации, и сроков хранения"
  cwe: "CWE-778"
  weakness_type: "недостатки, связанные с неправильной настройкой параметров ПО"
  orders: "Приказ ФСТЭК №117 от 11.04.2025 (ГИС, действует с 01.03.2026, заменил №17). Для ИСПДн — приказ №21 до его замены"
  description: >
    access_log off: обращения к веб-серверу не записываются, атаку на
    веб-приложение нельзя обнаружить и расследовать. Для сервера,
    доступного из Интернета, это частный показатель k42 методики оценки
    КЗИ.
  remediation: >
    Включите access_log и передавайте журнал в систему сбора событий,
    например access_log syslog:server=siem.example.local.
  target: nginx

- id: N004
  title: "Не ограничена частота запросов"
  severity: low
  measure: "п. 63 ж)"
  measure_title: "Защита веб-технологий"
  submeasure: "ЗВТ.3"
  submeasure_title: "Контроль и фильтрация трафика веб-приложений"
  activity: "ОО"
  activity_title: "Защита от компьютерных атак, направленных на отказ в обслуживании"
  pdn_measure: "ОДТ.1"
  pdn_measure_title: "Использование отказоустойчивых технических средств"
  cwe: "CWE-770"
  weakness_type: "недостатки, связанные с управлением ресурсами"
  orders: "Приказ ФСТЭК №117 от 11.04.2025 (ГИС, действует с 01.03.2026, заменил №17). Для ИСПДн — приказ №21 до его замены"
  description: >
    В конфигурации есть блоки server, но нет limit_req или limit_conn.
    Один клиент может отправить неограниченное число запросов, что
    облегчает подбор паролей и атаки на отказ в обслуживании.
  remediation: >
    Задайте зону limit_req_zone в блоке http и limit_req в блоках server
    или location, для которых нужна защита (вход, API).
  target: nginx
