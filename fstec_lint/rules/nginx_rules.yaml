# Правила для nginx. Базовая мера п. 63 ж) приказа ФСТЭК России N 117
# «Защита веб-технологий», подмеры ЗВТ методического документа ФСТЭК от
# 12.04.2026.

- id: N001
  title: "Разрешены устаревшие версии TLS"
  severity: high
  measure: "п. 63 ж)"
  measure_title: "Защита веб-технологий"
  submeasure: "ЗВТ.1"
  submeasure_title: "Защита пользовательских данных"
  activity: "КК"
  activity_title: "Контроль конфигураций информационных систем"
  pdn_measure: "ЗИС.3"
  pdn_measure_title: "Защита персональных данных при передаче по каналам связи"
  cwe: "CWE-327"
  weakness_type: "недостатки, связанные с криптографическими преобразованиями (недостатки шифрования)"
  orders: "Приказ ФСТЭК №117 от 11.04.2025 (ГИС, действует с 01.03.2026, заменил №17). Для ИСПДн — приказ №21 до его замены"
  description: >
    Указаны устаревшие протоколы или ssl_protocols не задан при использовании TLS. До nginx 1.27.3 умолчание включало TLSv1 и TLSv1.1; версия и эффективная конфигурация неизвестны.
  remediation: >
    Проверьте версию и установите поддерживаемые современные версии TLS.
  target: nginx

- id: N002
  title: "Включён вывод списка файлов каталога"
  severity: medium
  measure: "п. 63 ж)"
  measure_title: "Защита веб-технологий"
  submeasure: "ЗВТ.2"
  submeasure_title: "Управление доступом пользователей"
  activity: "КК"
  activity_title: "Контроль конфигураций информационных систем"
  pdn_measure: "УПД.2"
  pdn_measure_title: "Реализация необходимых методов, типов и правил разграничения доступа"
  cwe: "CWE-548"
  weakness_type: "недостатки, приводящие к утечке/раскрытию информации ограниченного доступа"
  orders: "Приказ ФСТЭК №117 от 11.04.2025 (ГИС, действует с 01.03.2026, заменил №17). Для ИСПДн — приказ №21 до его замены"
  description: >
    autoindex on: при отсутствии индексного файла nginx показывает
    содержимое каталога, включая резервные копии и служебные файлы.
  remediation: >
    Уберите autoindex on или установите autoindex off.
  target: nginx

- id: N003
  title: "Отключена регистрация обращений"
  severity: medium
  measure: "п. 63 ж)"
  measure_title: "Защита веб-технологий"
  submeasure: "ЗВТ.4"
  submeasure_title: "Регистрация событий безопасности в веб-приложениях и реагирование на них"
  activity: "МБ"
  activity_title: "Обеспечение мониторинга информационной безопасности"
  pdn_measure: "РСБ.1"
  pdn_measure_title: "Определение событий безопасности, подлежащих регистрации, и сроков хранения"
  cwe: "CWE-778"
  weakness_type: "недостатки, связанные с неправильной настройкой параметров ПО"
  orders: "Приказ ФСТЭК №117 от 11.04.2025 (ГИС, действует с 01.03.2026, заменил №17). Для ИСПДн — приказ №21 до его замены"
  description: >
    access_log off отключает журнал доступа nginx в данном контексте; другие источники событий не проверяются.
  remediation: >
    Проверьте нужное журналирование и настройте access_log при необходимости.
  target: nginx

