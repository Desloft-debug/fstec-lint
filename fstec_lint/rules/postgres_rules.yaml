# Правила для postgresql.conf и pg_hba.conf.
#
# Правовой статус на 31.08.2026 — см. подробный комментарий в
# compose_rules.yaml и README → "Правовой статус": приказ №21 формально
# действует, но готовится к полной отмене (проект от 24.07.2026); приказ
# №17 утратил силу и заменён приказом №117 (действует с 01.03.2026).
# Соответствие мерам справочное — сверяйте с действующей редакцией
# документа перед использованием в реальном проекте.

- id: P001
  title: "Слабый или отсутствующий метод аутентификации в pg_hba.conf"
  severity: critical
  measure: "ИАФ.1 / ИАФ.4"
  measure_title: "Идентификация и аутентификация пользователей / Управление средствами аутентификации"
  orders: "№21 (ПДн) / №117 (ГИС, действует с 01.03.2026 — заменил №17)"
  description: >
    Метод 'trust' разрешает подключение без проверки пароля, метод
    'md5' использует устаревшее хэширование, уязвимое к
    подбору/replay в отдельных сценариях.
  remediation: >
    Используйте scram-sha-256 для всех записей pg_hba.conf, задайте
    password_encryption = scram-sha-256.
  target: pg_hba

- id: P002
  title: "Подключение к СУБД разрешено с любого адреса"
  severity: high
  measure: "УПД.4"
  measure_title: "Управление доступом субъектов к объектам доступа"
  orders: "№21 (ПДн) / №117 (ГИС, действует с 01.03.2026 — заменил №17)"
  description: >
    Запись pg_hba.conf с адресом 0.0.0.0/0 или all разрешает
    подключение к базе данных с любого хоста сети.
  remediation: >
    Ограничьте адрес конкретной подсетью приложения, например
    10.0.0.0/24, вместо 0.0.0.0/0.
  target: pg_hba

- id: P003
  title: "listen_addresses = '*'"
  severity: medium
  measure: "ЗИС.20"
  measure_title: "Защита информации при взаимодействии с иными информационными системами"
  orders: "№21 (ПДн) / №117 (ГИС, действует с 01.03.2026 — заменил №17)"
  description: >
    Сервер PostgreSQL слушает подключения на всех сетевых
    интерфейсах, а не только на внутренних, необходимых приложению.
  remediation: >
    Укажите конкретный внутренний адрес или localhost, если СУБД не
    должна принимать подключения извне контейнера/хоста.
  target: postgresql_conf

- id: P004
  title: "Регистрация подключений отключена"
  severity: medium
  measure: "РСБ.1 / РСБ.3"
  measure_title: "Определение событий безопасности, подлежащих регистрации / Сбор, запись и хранение информации о событиях"
  orders: "№21 (ПДн) / №117 (ГИС, действует с 01.03.2026 — заменил №17)"
  description: >
    log_connections и/или log_disconnections выключены — события
    подключения и отключения клиентов не попадают в журнал аудита.
  remediation: >
    Включите log_connections = on и log_disconnections = on.
  target: postgresql_conf

- id: P005
  title: "Шифрование соединений отключено"
  severity: medium
  measure: "ЗИС.17 / ЗНИ.1"
  measure_title: "Обеспечение конфиденциальности информации при передаче / Защита машинных носителей информации"
  orders: "№21 (ПДн) / №117 (ГИС, действует с 01.03.2026 — заменил №17)"
  description: >
    ssl = off означает, что трафик между приложением и СУБД
    передаётся в открытом виде, включая учётные данные и данные
    запросов.
  remediation: >
    Включите ssl = on и настройте сертификаты сервера PostgreSQL.
  target: postgresql_conf

- id: P006
  title: "Устаревший алгоритм хэширования паролей"
  severity: high
  measure: "ИАФ.1"
  measure_title: "Идентификация и аутентификация пользователей"
  orders: "№21 (ПДн) / №117 (ГИС, действует с 01.03.2026 — заменил №17)"
  description: >
    password_encryption установлен в md5 — алгоритм не устойчив к
    современным методам подбора хэшей.
  remediation: >
    Установите password_encryption = scram-sha-256 и переустановите
    пароли пользователей СУБД.
  target: postgresql_conf

- id: P007
  title: "Аудит изменений схемы и данных отключён"
  severity: medium
  measure: "РСБ.2"
  measure_title: "Определение состава и содержания информации о событиях безопасности"
  orders: "№21 (ПДн) / №117 (ГИС, действует с 01.03.2026 — заменил №17)"
  description: >
    log_statement не установлен в 'ddl', 'mod' или 'all' — изменения
    структуры базы данных и/или данных не фиксируются в журнале,
    что затрудняет расследование инцидентов.
  remediation: >
    Установите log_statement = 'ddl' как минимум, для более полного
    аудита — 'mod' или 'all' (с учётом нагрузки на диск).
  target: postgresql_conf

- id: P008
  title: "Не задан statement_timeout"
  severity: low
  measure: "ОДТ.1"
  measure_title: "Обеспечение доступности информации"
  orders: "№21 (ПДн) / №117 (ГИС, действует с 01.03.2026 — заменил №17)"
  description: >
    statement_timeout = 0 (значение по умолчанию) означает, что
    запросы могут выполняться неограниченно долго, что позволяет
    одному аварийному или намеренно вредоносному запросу удерживать
    соединения и ресурсы СУБД.
  remediation: >
    Задайте разумный statement_timeout (например, '30s') глобально
    или на уровне роли приложения.
  target: postgresql_conf
