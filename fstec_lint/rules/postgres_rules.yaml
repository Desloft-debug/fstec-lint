# Правила для postgresql.conf и pg_hba.conf.
#
# Привязка мер — по приказу ФСТЭК России от 11.04.2025 N 117
# (зарегистрирован Минюстом 16.06.2025, N 82619, действует с 01.03.2026),
# который признал утратившим силу приказ N 17. Ссылки даны на пункты
# самого приказа:
#
#   * поле `measure` вида "п. 63 д)" — базовая мера защиты из пункта 63
#     Требований (17 базовых мер, подпункты а–с);
#   * поле `measure` вида "п. 34 б)" — мероприятие по защите информации
#     из пункта 34 Требований (22 мероприятия, подпункты а–х).
#
# Кодов мер вида ЗСВ.2 или УПД.4 в приказе N 117 нет: такая таксономия
# осталась в приказе N 21, который действует для ИСПДн. Привязка по нему
# лежит в поле `pdn_measure`, детализация до подмер — в `submeasure` по
# методическому документу ФСТЭК от 12.04.2026.
#
# Для ИСПДн продолжает действовать приказ N 21 до его замены.
#
# Соответствие носит справочный характер: перед применением в реальном
# проекте сверьте привязку с вашей моделью угроз и актом классификации.

- id: P001
  title: "Слабый или отсутствующий метод аутентификации в pg_hba.conf"
  severity: critical
  measure: "п. 63 а)"
  measure_title: "Идентификация и аутентификация"
  submeasure: "ИАФ.3"
  submeasure_title: "Аутентификация пользователей"
  activity: "ПД"
  activity_title: "Защита информации при предоставлении привилегированного доступа"
  pdn_measure: "ИАФ.1"
  pdn_measure_title: "Идентификация и аутентификация пользователей — работников оператора"
  cwe: "CWE-287"
  weakness_type: "недостатки, связанные с аутентификацией"
  orders: "Приказ ФСТЭК №117 от 11.04.2025 (ГИС, действует с 01.03.2026, заменил №17). Для ИСПДн — приказ №21 до его замены"
  description: >
    Метод 'trust' разрешает подключение без проверки аутентификационной
    информации вовсе. Метод 'md5' даёт простую аутентификацию
    (ГОСТ Р 58833-2020, п. 3.46) со слабым хранением аутентификационной
    информации: устаревшее хэширование уязвимо к подбору и к replay в
    отдельных сценариях. По п. 7.2 простая аутентификация обеспечивает
    только низкий уровень доверия к результатам.
  remediation: >
    Используйте scram-sha-256 для всех записей pg_hba.conf, задайте
    password_encryption = scram-sha-256.
  target: pg_hba

- id: P002
  title: "Подключение к СУБД разрешено с любого адреса"
  severity: high
  measure: "п. 63 п)"
  measure_title: "Сегментация и межсетевое экранирование"
  submeasure: "МСЭ.3"
  submeasure_title: "Контроль сетевого доступа и фильтрация трафика"
  activity: "КК"
  activity_title: "Контроль конфигураций информационных систем"
  pdn_measure: "УПД.3"
  pdn_measure_title: "Управление информационными потоками между устройствами и сегментами"
  cwe: "CWE-284"
  weakness_type: "недостатки, связанные с управлением разрешениями, привилегиями и доступом"
  orders: "Приказ ФСТЭК №117 от 11.04.2025 (ГИС, действует с 01.03.2026, заменил №17). Для ИСПДн — приказ №21 до его замены"
  description: >
    Запись pg_hba.conf с адресом 0.0.0.0/0 или all разрешает
    подключение к базе данных с любого хоста сети.
  remediation: >
    Ограничьте адрес конкретной подсетью приложения, например
    10.0.0.0/24, вместо 0.0.0.0/0.
  target: pg_hba

- id: P003
  title: "listen_addresses = '*'"
  severity: medium
  measure: "п. 63 п)"
  measure_title: "Сегментация и межсетевое экранирование"
  submeasure: "МСЭ.3"
  submeasure_title: "Контроль сетевого доступа и фильтрация трафика"
  activity: "КК"
  activity_title: "Контроль конфигураций информационных систем"
  pdn_measure: "УПД.3"
  pdn_measure_title: "Управление информационными потоками между устройствами и сегментами"
  cwe: "CWE-1327"
  weakness_type: "недостатки, связанные с неправильной настройкой параметров ПО"
  orders: "Приказ ФСТЭК №117 от 11.04.2025 (ГИС, действует с 01.03.2026, заменил №17). Для ИСПДн — приказ №21 до его замены"
  description: >
    Сервер PostgreSQL слушает подключения на всех сетевых
    интерфейсах, а не только на внутренних, необходимых приложению.
  remediation: >
    Укажите конкретный внутренний адрес или localhost, если СУБД не
    должна принимать подключения извне контейнера/хоста.
  target: postgresql_conf

- id: P004
  title: "Регистрация подключений отключена"
  severity: medium
  measure: "п. 63 в)"
  measure_title: "Регистрация событий безопасности"
  submeasure: "РСБ.1"
  submeasure_title: "Определение событий безопасности и данных о них, подлежащих регистрации"
  activity: "МБ"
  activity_title: "Обеспечение мониторинга информационной безопасности"
  pdn_measure: "РСБ.1"
  pdn_measure_title: "Определение событий безопасности, подлежащих регистрации, и сроков хранения"
  cwe: "CWE-778"
  weakness_type: "недостатки, связанные с неправильной настройкой параметров ПО"
  orders: "Приказ ФСТЭК №117 от 11.04.2025 (ГИС, действует с 01.03.2026, заменил №17). Для ИСПДн — приказ №21 до его замены"
  description: >
    log_connections и/или log_disconnections выключены — события
    подключения и отключения клиентов не попадают в журнал аудита.
  remediation: >
    Включите log_connections = on и log_disconnections = on.
  target: postgresql_conf

- id: P005
  title: "Шифрование соединений отключено"
  severity: medium
  measure: "п. 63 с)"
  measure_title: "Защита каналов передачи данных и сетевого взаимодействия"
  submeasure: "ЗКС.1"
  submeasure_title: "Защита данных при передаче по каналам связи"
  activity: "КК"
  activity_title: "Контроль конфигураций информационных систем"
  pdn_measure: "ЗИС.3"
  pdn_measure_title: "Защита персональных данных при передаче по каналам связи"
  cwe: "CWE-319"
  weakness_type: "недостатки, связанные с криптографическими преобразованиями (недостатки шифрования)"
  orders: "Приказ ФСТЭК №117 от 11.04.2025 (ГИС, действует с 01.03.2026, заменил №17). Для ИСПДн — приказ №21 до его замены"
  description: >
    ssl = off означает, что трафик между приложением и СУБД
    передаётся в открытом виде, включая учётные данные и данные
    запросов.
  remediation: >
    Включите ssl = on и настройте сертификаты сервера PostgreSQL.
  target: postgresql_conf

- id: P006
  title: "Устаревший алгоритм хэширования паролей"
  severity: high
  measure: "п. 63 а)"
  measure_title: "Идентификация и аутентификация"
  submeasure: "ИАФ.3"
  submeasure_title: "Аутентификация пользователей"
  activity: "ПД"
  activity_title: "Защита информации при предоставлении привилегированного доступа"
  pdn_measure: "ИАФ.4"
  pdn_measure_title: "Управление средствами аутентификации, в том числе их хранение"
  cwe: "CWE-916"
  weakness_type: "недостатки, связанные с криптографическими преобразованиями (недостатки шифрования)"
  orders: "Приказ ФСТЭК №117 от 11.04.2025 (ГИС, действует с 01.03.2026, заменил №17). Для ИСПДн — приказ №21 до его замены"
  description: >
    password_encryption установлен в md5 — алгоритм не устойчив к
    современным методам подбора хэшей. Метод хранения аутентификационной
    информации напрямую определяет, сохраняет ли аутентификация тот
    уровень доверия, который заявлен видом аутентификации
    (ГОСТ Р 58833-2020, п. 6.18).
  remediation: >
    Установите password_encryption = scram-sha-256 и переустановите
    пароли пользователей СУБД.
  target: postgresql_conf

- id: P007
  title: "Аудит изменений схемы и данных отключён"
  severity: medium
  measure: "п. 63 в)"
  measure_title: "Регистрация событий безопасности"
  submeasure: "РСБ.1"
  submeasure_title: "Определение событий безопасности и данных о них, подлежащих регистрации"
  activity: "МБ"
  activity_title: "Обеспечение мониторинга информационной безопасности"
  pdn_measure: "РСБ.2"
  pdn_measure_title: "Определение состава и содержания информации о событиях безопасности"
  cwe: "CWE-778"
  weakness_type: "недостатки, связанные с неправильной настройкой параметров ПО"
  orders: "Приказ ФСТЭК №117 от 11.04.2025 (ГИС, действует с 01.03.2026, заменил №17). Для ИСПДн — приказ №21 до его замены"
  description: >
    log_statement не установлен в 'ddl', 'mod' или 'all' — изменения
    структуры базы данных и/или данных не фиксируются в журнале,
    что затрудняет расследование инцидентов.
  remediation: >
    Установите log_statement = 'ddl' как минимум, для более полного
    аудита — 'mod' или 'all' (с учётом нагрузки на диск).
  target: postgresql_conf

- id: P008
  title: "Не задан statement_timeout"
  severity: low
  measure: "п. 63 р)"
  measure_title: "Защита от компьютерных атак, направленных на отказ в обслуживании"
  submeasure: "ЗОО.5"
  submeasure_title: "Ограничение нагрузки"
  activity: "НФ"
  activity_title: "Непрерывность функционирования при нештатных ситуациях"
  pdn_measure: "ОДТ.1"
  pdn_measure_title: "Использование отказоустойчивых технических средств"
  cwe: "CWE-770"
  weakness_type: "недостатки, связанные с управлением ресурсами"
  orders: "Приказ ФСТЭК №117 от 11.04.2025 (ГИС, действует с 01.03.2026, заменил №17). Для ИСПДн — приказ №21 до его замены"
  description: >
    statement_timeout = 0 (значение по умолчанию) означает, что
    запросы могут выполняться неограниченно долго, что позволяет
    одному аварийному или намеренно вредоносному запросу удерживать
    соединения и ресурсы СУБД.
  remediation: >
    Задайте разумный statement_timeout (например, '30s') глобально
    или на уровне роли приложения.
  target: postgresql_conf
