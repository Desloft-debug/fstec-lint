# Привязки справочные; наличие секрета не доказывает его публикацию в Git.
- id: E001
  title: "Секрет в открытом виде в .env"
  severity: high
  measure: "п. 63 а)"
  measure_title: "Идентификация и аутентификация"
  submeasure: "ИАФ.3"
  submeasure_title: "Аутентификация пользователей"
  activity: "ОД"
  activity_title: "Защита информации при обращении с информацией ограниченного доступа"
  pdn_measure: "ИАФ.4"
  pdn_measure_title: "Управление средствами аутентификации, в том числе их хранение"
  cwe: "CWE-312"
  weakness_type: "недостатки, связанные с управлением полномочиями (учетными данными)"
  orders: "Приказ ФСТЭК №117 от 11.04.2025 (ГИС). Для ИСПДн — приказ №21"
  description: >
    Непустое значение переменной с именем пароля, токена или ключа,
    либо пароль в URL подключения хранится в .env открытым текстом.
    Это потенциальная утечка при доступе к файлу; проверка не определяет,
    отслеживается ли файл в Git и каковы его права доступа.
    Простые подстановки вне одинарных кавычек, пустые значения и имена
    на _FILE/_FILENAME не считаются секретом. Непустой литеральный
    дефолт и строки в одинарных кавычках проверяются.
  remediation: >
    Передавайте секреты через хранилище секретов или файлы с ограниченным
    доступом. Уберите рабочие секреты из репозитория; если они были
    опубликованы, отзовите и замените их. Для шаблонов используйте пустые
    значения или ссылки на внешние переменные.
  target: dotenv

- id: E002
  title: "Включён режим отладки в .env"
  severity: medium
  measure: "п. 34 б)"
  measure_title: "Контроль конфигураций информационных систем"
  submeasure: "УПД.2"
  submeasure_title: "Разграничение и контроль прав доступа"
  activity: "КК"
  activity_title: "Контроль конфигураций информационных систем"
  pdn_measure: "АНЗ.3"
  pdn_measure_title: "Контроль работоспособности, параметров настройки и функционирования ПО"
  cwe: "CWE-489"
  weakness_type: "недостатки, приводящие к утечке/раскрытию информации ограниченного доступа"
  orders: "Приказ ФСТЭК №117 от 11.04.2025 (ГИС). Для ИСПДн — приказ №21"
  description: >
    Переменная DEBUG или переменная с суффиксом _DEBUG имеет значение
    1, true, yes или on. Отладочные страницы могут раскрывать внутренние
    данные приложения. Название .env-файла не определяет, используется
    ли он в production: среду применения оценивает оператор.
  remediation: >
    Отключите debug в рабочем окружении: DEBUG=false или DEBUG=0.
    Отдельные конфигурации разработки исключайте через --exclude
    либо подавляйте правило комментарием с обоснованием.
  target: dotenv

- id: E003
  title: "Отключена защита TLS в .env"
  severity: high
  measure: "п. 63 с)"
  measure_title: "Защита каналов передачи данных и сетевого взаимодействия"
  submeasure: "ЗКС.1"
  submeasure_title: "Защита данных при передаче по каналам связи"
  activity: "КК"
  activity_title: "Контроль конфигураций информационных систем"
  pdn_measure: "ЗИС.3"
  pdn_measure_title: "Защита персональных данных при передаче по каналам связи"
  cwe: "CWE-295"
  weakness_type: "недостатки, связанные с криптографическими преобразованиями (недостатки шифрования)"
  orders: "Приказ ФСТЭК №117 от 11.04.2025 (ГИС). Для ИСПДн — приказ №21"
  description: >
    NODE_TLS_REJECT_UNAUTHORIZED=0 или заданный GIT_SSL_NO_VERIFY
    отключает проверку сертификатов; PGSSLMODE=disable отключает TLS
    при подключении libpq к PostgreSQL. Это допускает перехват данных
    или подмену узла. Произвольные переменные с SSL/TLS в имени
    не проверяются, поскольку их смысл зависит от приложения.
    Git отключает проверку при любом значении GIT_SSL_NO_VERIFY,
    включая false, 0 и пустую строку.
  remediation: >
    Удалите GIT_SSL_NO_VERIFY, включите проверку сертификата и настройте доверенный центр
    сертификации. Для libpq используйте PGSSLMODE=verify-full
    с доверенным сертификатом сервера.
  target: dotenv
