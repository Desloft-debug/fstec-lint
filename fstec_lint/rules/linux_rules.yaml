# Учётные записи и журналирование Linux: /etc/login.defs,
# /etc/security/pwquality.conf, /etc/default/useradd, /etc/rsyslog.conf.

- id: A001
  title: "Не ограничен срок действия пароля"
  severity: low
  measure: "п. 63 а)"
  measure_title: "Идентификация и аутентификация"
  submeasure: "ИАФ.3"
  submeasure_title: "Аутентификация пользователей"
  activity: "КК"
  activity_title: "Контроль конфигураций информационных систем"
  pdn_measure: "ИАФ.4"
  pdn_measure_title: "Управление средствами аутентификации, в том числе их хранение"
  cwe: "CWE-262"
  weakness_type: "недостатки, связанные с аутентификацией"
  orders: "Приказ ФСТЭК №117 от 11.04.2025 (ГИС, действует с 01.03.2026, заменил №17). Для ИСПДн — приказ №21 до его замены"
  description: >
    В login.defs не задан PASS_MAX_DAYS или он больше 90 дней (значение
    по умолчанию 99999 означает бессрочный пароль). Утёкший пароль
    остаётся действительным неограниченно долго.
  remediation: >
    Установите PASS_MAX_DAYS 90 или меньше в соответствии с парольной
    политикой организации; для существующих учётных записей примените
    chage -M.
  target: login_defs

- id: A002
  title: "Слабые требования к сложности пароля"
  severity: medium
  measure: "п. 63 а)"
  measure_title: "Идентификация и аутентификация"
  submeasure: "ИАФ.3"
  submeasure_title: "Аутентификация пользователей"
  activity: "КК"
  activity_title: "Контроль конфигураций информационных систем"
  pdn_measure: "ИАФ.4"
  pdn_measure_title: "Управление средствами аутентификации, в том числе их хранение"
  cwe: "CWE-521"
  weakness_type: "недостатки, связанные с аутентификацией"
  orders: "Приказ ФСТЭК №117 от 11.04.2025 (ГИС, действует с 01.03.2026, заменил №17). Для ИСПДн — приказ №21 до его замены"
  description: >
    В pwquality.conf (с учётом pwquality.conf.d) минимальная длина пароля
    не задана или меньше 8 символов, либо требуется меньше трёх классов
    символов (цифры, строчные, прописные, специальные). Без заданной
    политики нельзя подтвердить частный показатель k21 методики оценки
    КЗИ: учётных записей с паролями ниже парольной политики нет.
  remediation: >
    Задайте minlen = 8 или больше и minclass = 3 (или отрицательные
    dcredit, ucredit, lcredit, ocredit для обязательных классов).
  target: pwquality

- id: R001
  title: "События не передаются на централизованный сервер"
  severity: medium
  measure: "п. 63 в)"
  measure_title: "Регистрация событий безопасности"
  submeasure: "РСБ.4"
  submeasure_title: "Требования к сбору, хранению и защите данных о событиях безопасности"
  activity: "МБ"
  activity_title: "Обеспечение мониторинга информационной безопасности"
  pdn_measure: "РСБ.1"
  pdn_measure_title: "Определение событий безопасности, подлежащих регистрации, и сроков хранения"
  cwe: "CWE-778"
  weakness_type: "недостатки, связанные с неправильной настройкой параметров ПО"
  orders: "Приказ ФСТЭК №117 от 11.04.2025 (ГИС, действует с 01.03.2026, заменил №17). Для ИСПДн — приказ №21 до его замены"
  description: >
    В rsyslog.conf и подключённых файлах нет правила пересылки событий на
    удалённый сервер (@host, @@host, action с omfwd или omrelp). События
    хранятся только локально. Централизованный сбор событий — частные
    показатели k41 и k42 методики оценки КЗИ.
  remediation: >
    Добавьте пересылку на сервер сбора событий, например
    *.* @@siem.example.local:514 или action(type="omfwd"
    target="siem.example.local" port="514" protocol="tcp").
  target: rsyslog

- id: A003
  title: "Не блокируются неиспользуемые учётные записи"
  severity: medium
  measure: "п. 63 б)"
  measure_title: "Управление доступом"
  submeasure: "УПД.3"
  submeasure_title: "Управление учетными записями"
  activity: "КК"
  activity_title: "Контроль конфигураций информационных систем"
  pdn_measure: "УПД.1"
  pdn_measure_title: "Управление (заведение, активация, блокирование и уничтожение) учётными записями пользователей, в том числе внешних пользователей"
  cwe: "CWE-262"
  weakness_type: "недостатки, связанные с управлением полномочиями (учетными данными)"
  orders: "Приказ ФСТЭК №117 от 11.04.2025 (ГИС, действует с 01.03.2026, заменил №17). Для ИСПДн — приказ №21 до его замены"
  description: >
    В /etc/default/useradd не задан INACTIVE, он равен -1 или больше 35
    дней. INACTIVE задаёт, через сколько дней после истечения пароля
    учётная запись блокируется. Без него забытая учётная запись
    уволенного работника остаётся рабочей, пока её не удалят вручную
    (частный показатель k24 методики оценки КЗИ).
  remediation: >
    Выполните useradd -D -f 35 (или меньше) и примените то же значение к
    существующим учётным записям: chage --inactive 35 <имя>. Срок
    действия пароля задаётся PASS_MAX_DAYS в login.defs (правило A001).
  target: useradd_defaults
