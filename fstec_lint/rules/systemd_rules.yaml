# Правила для юнитов systemd (*.service).
#
# Привязка мер — по приказу ФСТЭК России от 11.04.2025 N 117
# (зарегистрирован Минюстом 16.06.2025, N 82619, действует с 01.03.2026),
# который признал утратившим силу приказ N 17. Ссылки даны на пункты
# самого приказа:
#
#   * поле `measure` вида "п. 63 д)" — базовая мера защиты из пункта 63
#     Требований (17 базовых мер, подпункты а–с);
#   * поле `measure` вида "п. 34 б)" — мероприятие по защите информации
#     из пункта 34 Требований (22 мероприятия, подпункты а–х).
#
# Кодов мер вида ЗСВ.2 или УПД.4 в приказе N 117 НЕТ: они были в
# приложении к утратившему силу приказу N 17. Старая привязка сохранена
# в поле `legacy_measure` как история, а не как утверждение о
# соответствии. Детализация базовых мер до подмер выйдет в методических
# документах ФСТЭК (пункт 31 Требований); до их публикации привязка
# ведётся на уровне пунктов приказа.
#
# Для ИСПДн продолжает действовать приказ N 21 до его замены.
#
# Соответствие носит справочный характер: перед применением в реальном
# проекте сверьте привязку с вашей моделью угроз и актом классификации.

- id: U001
  title: "Сервис выполняется от root"
  severity: high
  measure: "п. 63 б)"
  measure_title: "Управление доступом"
  submeasure: "УПД.2"
  submeasure_title: "Разграничение и контроль прав доступа"
  activity: "ПД"
  activity_title: "Защита информации при предоставлении привилегированного доступа"
  pdn_measure: "УПД.5"
  pdn_measure_title: "Назначение минимально необходимых прав и привилегий"
  cwe: "CWE-250"
  weakness_type: "недостатки, связанные с управлением разрешениями, привилегиями и доступом"
  orders: "Приказ ФСТЭК №117 от 11.04.2025 (ГИС, действует с 01.03.2026, заменил №17). Для ИСПДн — приказ №21 до его замены"
  description: >
    В секции [Service] не задан User (или задан root) — процесс
    работает с максимальными привилегиями на хосте, хотя
    большинству сервисов это не требуется.
  remediation: >
    Заведите отдельного системного пользователя и укажите
    User=<имя> (и Group=<имя>) в [Service].
  target: systemd_unit

- id: U002
  title: "Не установлен NoNewPrivileges"
  severity: medium
  measure: "п. 63 б)"
  measure_title: "Управление доступом"
  submeasure: "УПД.2"
  submeasure_title: "Разграничение и контроль прав доступа"
  activity: "ПД"
  activity_title: "Защита информации при предоставлении привилегированного доступа"
  pdn_measure: "УПД.5"
  pdn_measure_title: "Назначение минимально необходимых прав и привилегий"
  cwe: "CWE-250"
  weakness_type: "недостатки, связанные с управлением разрешениями, привилегиями и доступом"
  orders: "Приказ ФСТЭК №117 от 11.04.2025 (ГИС, действует с 01.03.2026, заменил №17). Для ИСПДн — приказ №21 до его замены"
  description: >
    Без NoNewPrivileges=true процесс может получить дополнительные
    привилегии через setuid/setgid-бинарники или файловые capabilities.
  remediation: >
    Добавьте NoNewPrivileges=true в [Service].
  target: systemd_unit

- id: U003
  title: "Не установлен ProtectSystem"
  severity: medium
  measure: "п. 63 б)"
  measure_title: "Управление доступом"
  submeasure: "УПД.2"
  submeasure_title: "Разграничение и контроль прав доступа"
  activity: "КК"
  activity_title: "Контроль конфигураций информационных систем"
  pdn_measure: "ОЦЛ.1"
  pdn_measure_title: "Контроль целостности программного обеспечения"
  cwe: "CWE-732"
  weakness_type: "недостатки, связанные с управлением разрешениями, привилегиями и доступом"
  orders: "Приказ ФСТЭК №117 от 11.04.2025 (ГИС, действует с 01.03.2026, заменил №17). Для ИСПДн — приказ №21 до его замены"
  description: >
    Без ProtectSystem=full/strict сервис может писать в системные
    каталоги хоста (/usr, /boot и т.д.), что упрощает закрепление
    при компрометации.
  remediation: >
    Добавьте ProtectSystem=strict (или full, если сервису нужно
    писать в /etc) в [Service].
  target: systemd_unit

- id: U004
  title: "Не установлен PrivateTmp"
  severity: low
  measure: "п. 63 б)"
  measure_title: "Управление доступом"
  submeasure: "УПД.2"
  submeasure_title: "Разграничение и контроль прав доступа"
  activity: "КК"
  activity_title: "Контроль конфигураций информационных систем"
  pdn_measure: "ОПС.4"
  pdn_measure_title: "Управление временными файлами"
  cwe: "CWE-377"
  weakness_type: "недостатки, связанные с неправильной настройкой параметров ПО"
  orders: "Приказ ФСТЭК №117 от 11.04.2025 (ГИС, действует с 01.03.2026, заменил №17). Для ИСПДн — приказ №21 до его замены"
  description: >
    Без PrivateTmp=true сервис делит /tmp с остальной системой, что
    даёт возможность подглядывать/подменять временные файлы других
    процессов.
  remediation: >
    Добавьте PrivateTmp=true в [Service].
  target: systemd_unit

- id: U005
  title: "Не установлен ProtectHome"
  severity: low
  measure: "п. 63 б)"
  measure_title: "Управление доступом"
  submeasure: "УПД.2"
  submeasure_title: "Разграничение и контроль прав доступа"
  activity: "ПД"
  activity_title: "Защита информации при предоставлении привилегированного доступа"
  pdn_measure: "УПД.2"
  pdn_measure_title: "Реализация необходимых методов, типов и правил разграничения доступа"
  cwe: "CWE-732"
  weakness_type: "недостатки, связанные с управлением разрешениями, привилегиями и доступом"
  orders: "Приказ ФСТЭК №117 от 11.04.2025 (ГИС, действует с 01.03.2026, заменил №17). Для ИСПДн — приказ №21 до его замены"
  description: >
    Без ProtectHome сервис может читать (а в некоторых конфигурациях —
    и писать) домашние каталоги пользователей хоста, хотя сервисам
    это обычно не нужно.
  remediation: >
    Добавьте ProtectHome=true (или read-only) в [Service].
  target: systemd_unit
