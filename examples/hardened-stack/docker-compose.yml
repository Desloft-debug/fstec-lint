version: "3.8"

services:
  db:
    networks: [backend]
    image: postgres:16.4
    user: "999:999"
    read_only: true
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 5s
      retries: 3
    tmpfs:
      - /tmp
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: appdb
    secrets:
      - db_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - pgdata:/var/lib/postgresql/data

  web:
    networks: [backend, frontend]
    build: .
    image: myorg/web:1.4.2
    user: "1000:1000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DB_PASSWORD_FILE: /run/secrets/db_password
      DEBUG: "false"
    secrets:
      - db_password

secrets:
  db_password:
    file: ./secrets/db_password.txt

networks:
  backend:
    internal: true
  frontend:

volumes:
  pgdata:
