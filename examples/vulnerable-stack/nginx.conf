events {}

http {
    server {
        listen 443 ssl;
        server_name app.example.test;
        ssl_certificate     /etc/nginx/tls/app.crt;
        ssl_certificate_key /etc/nginx/tls/app.key;
        ssl_protocols TLSv1 TLSv1.1 TLSv1.2;

        access_log off;

        location /files/ {
            autoindex on;
        }

        location / {
            proxy_pass http://web:8080;
        }
    }
}
