name: "fstec-lint"
description: "Статический аудит Docker/Dockerfile/PostgreSQL/sshd/systemd конфигураций с привязкой к мерам ФСТЭК (приказ №21 / приказ №117, заменивший №17)"
author: "Desloft-debug"
branding:
  icon: "shield"
  color: "blue"

inputs:
  path:
    description: "Каталог для сканирования"
    required: false
    default: "."
  format:
    description: "Формат отчёта: text | json | html | sarif"
    required: false
    default: "text"
  output:
    description: "Путь для сохранения отчёта (расширение задавайте под format)"
    required: false
    default: "fstec-lint-report.txt"
  fail-on:
    description: "Минимальная severity, при которой джоба падает: critical | high | medium | low | none"
    required: false
    default: "high"

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install fstec-lint
      shell: bash
      # Ставим ту же ревизию, с которой вызван сам Action: без этого
      # 'uses: ...@v0.9.0' закрепляет обёртку, а инструмент всё равно
      # приезжал бы с HEAD и прогон перестал бы быть воспроизводимым.
      #
      # Пустой action_ref означает вызов из локального пути (./), где
      # ревизии нет — тогда ставим из самого чекаута, а не из 'main':
      # молча подменять версию инструмента нельзя.
      run: |
        set -eu
        ref="${{ github.action_ref }}"
        if [ -n "$ref" ]; then
          pip install "fstec-lint @ git+https://github.com/Desloft-debug/fstec-lint.git@${ref}"
        else
          pip install "${{ github.action_path }}"
        fi
        fstec-lint --version

    - name: Run fstec-lint
      shell: bash
      run: |
        fstec-lint "${{ inputs.path }}" \
          --format "${{ inputs.format }}" \
          --output "${{ inputs.output }}" \
          --fail-on "${{ inputs.fail-on }}"

    - name: Upload report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: fstec-lint-report
        path: ${{ inputs.output }}
