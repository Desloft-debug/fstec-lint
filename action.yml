name: "fstec-lint"
description: "Статический аудит Docker/Dockerfile/PostgreSQL/sshd/systemd конфигураций с привязкой к мерам ФСТЭК (приказ №21 / приказ №117, заменивший №17)"
author: "Desloft-debug"
branding:
  icon: "shield"
  color: "blue"

inputs:
  path:
    description: "Каталог для сканирования"
    required: false
    default: "."
  format:
    description: "Формат отчёта: text | json | json-context | html | sarif"
    required: false
    default: "text"
  output:
    description: "Имя файла отчёта без пути (расширение задавайте под format)"
    required: false
    default: "fstec-lint-report.txt"
  fail-on:
    description: "Минимальная severity, при которой джоба падает: critical | high | medium | low | none"
    required: false
    default: "high"

  upload-report:
    description: "Сохранить отчёт как артефакт GitHub Actions (может содержать данные проекта)"
    required: false
    default: "false"

outputs:
  report:
    description: "Путь к новому отчёту во временном каталоге runner"
    value: ${{ steps.scan.outputs.report }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install fstec-lint
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      # The Action checkout is already resolved by the runner. Do not fetch a
      # mutable ref a second time. The caller must trust the selected Action.
      run: |
        set -eu
        python -m pip install -c "$ACTION_PATH/constraints.txt" -- "$ACTION_PATH"
        python -I -m fstec_lint --version

    - name: Run fstec-lint
      id: scan
      shell: bash
      env:
        SCAN_PATH: ${{ inputs.path }}
        REPORT_FORMAT: ${{ inputs.format }}
        REPORT_OUTPUT: ${{ inputs.output }}
        FAIL_ON: ${{ inputs.fail-on }}
      run: |
        set -eu
        if [[ ! "$REPORT_OUTPUT" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]{0,119}$ ]]; then
          echo "output must be a file name, without a directory"
          exit 2
        fi
        umask 077
        private_dir="$(mktemp -d "${RUNNER_TEMP:?}/fstec-lint.XXXXXXXX")"
        report="$private_dir/$REPORT_OUTPUT"
        status=0
        python -I -m fstec_lint --format="$REPORT_FORMAT" \
          --output="$report" --fail-on="$FAIL_ON" \
          --no-inline-suppressions --strict-scope --require-input -- "$SCAN_PATH" || status=$?
        if [[ "$status" =~ ^[013]$ && -f "$report" && ! -L "$report" ]]; then
          printf 'report=%s\n' "$report" >> "$GITHUB_OUTPUT"
        fi
        exit "$status"

    - name: Upload report
      if: ${{ !cancelled() && inputs.upload-report == 'true' && steps.scan.outputs.report != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: fstec-lint-report
        path: ${{ steps.scan.outputs.report }}
        if-no-files-found: error
