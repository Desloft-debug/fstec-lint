name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Версии инструментов зафиксированы в constraints.txt: без этого
      # сборка ломается от чужого релиза, а «проверено ruff/mypy» перестаёт
      # быть воспроизводимым утверждением.
      - run: pip install -e ".[dev]" -c constraints.txt
      - name: ruff check
        run: ruff check fstec_lint tests
      - name: ruff format --check
        run: ruff format --check fstec_lint tests
      - name: mypy
        run: mypy fstec_lint

      # ГОСТ Р 56939-2024, п. 5.16.2.3: контролировать перечень
      # зависимостей на предмет наличия известных уязвимостей.
      # Аудит идёт по constraints.txt — это и есть перечень зависимостей
      # с указанием версий по п. 5.16.3.2. Сам пакет пропущен: он
      # ставится из исходников и на PyPI его нет.
      - name: pip-audit (композиционный анализ зависимостей)
        run: |
          pip install pip-audit
          pip-audit --strict -r constraints.txt

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]" -c constraints.txt
      - run: pytest -v --cov=fstec_lint --cov-report=term-missing

  self-scan:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: Сканирование заведомо уязвимого стенда (нарушения ожидаемы)
        run: fstec-lint examples/vulnerable-stack --fail-on none
      - name: Сканирование защищённого стенда (обязан пройти)
        run: fstec-lint examples/hardened-stack --fail-on high
      # Стенды — это ещё и проверка кодов возврата: гейт, который не
      # падает на заведомо уязвимой конфигурации, бесполезен.
      - name: Уязвимый стенд обязан дать код 1
        run: |
          set +e
          fstec-lint examples/vulnerable-stack --fail-on high >/dev/null
          code=$?
          set -e
          test "$code" -eq 1 || { echo "ожидался код 1, получен $code"; exit 1; }
