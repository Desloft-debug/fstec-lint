name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: ruff check
        run: ruff check fstec_lint tests
      - name: ruff format --check
        run: ruff format --check fstec_lint tests
      - name: mypy
        run: mypy fstec_lint --ignore-missing-imports

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -v

  self-scan:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: Сканирование заведомо уязвимого стенда (нарушения ожидаемы)
        run: fstec-lint examples/vulnerable-stack --fail-on none
      - name: Сканирование защищённого стенда (обязан пройти)
        run: fstec-lint examples/hardened-stack --fail-on high
