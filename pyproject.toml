[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fstec-lint"
version = "0.3.0"
description = "Статический аудит Docker/PostgreSQL/sshd/systemd инфраструктуры с привязкой находок к мерам защиты ФСТЭК (приказ №21 / приказ №117, заменивший №17)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Desloft-debug" }]
keywords = ["security", "fstec", "docker", "postgresql", "compliance", "linter", "iso27001", "devsecops"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.urls]
Homepage = "https://github.com/Desloft-debug/fstec-lint"
Issues = "https://github.com/Desloft-debug/fstec-lint/issues"

[project.scripts]
fstec-lint = "fstec_lint.cli:main"

[tool.setuptools.packages.find]
include = ["fstec_lint*"]

[tool.setuptools.package-data]
fstec_lint = ["rules/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "UP", "I", "B"]

[tool.ruff.lint.per-file-ignores]
# Встроенные HTML/CSS-шаблоны длиннее лимита в 100 символов — разбивать их
# построчно только ради ruff не имеет смысла.
"fstec_lint/reporters/html.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
