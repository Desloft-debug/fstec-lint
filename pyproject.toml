[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fstec-lint"
version = "1.5.0"
description = "Статический аудит Docker/Dockerfile/PostgreSQL/sshd/systemd инфраструктуры с привязкой находок к мерам защиты ФСТЭК (приказ №21 / приказ №117, заменивший №17)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Desloft-debug" }]
keywords = ["security", "fstec", "docker", "postgresql", "compliance", "linter", "iso27001", "devsecops"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/Desloft-debug/fstec-lint"
Issues = "https://github.com/Desloft-debug/fstec-lint/issues"

[project.scripts]
fstec-lint = "fstec_lint.cli:main"

[tool.setuptools.packages.find]
include = ["fstec_lint*"]

[tool.setuptools.package-data]
fstec_lint = ["rules/*.yaml"]

[tool.coverage.report]
# Проверки и парсеры — то, чем инструмент, собственно, судит. Провал
# порога здесь означает правило, которое никто не прогонял.
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "UP", "I", "B"]

[tool.ruff.lint.per-file-ignores]
# Встроенные HTML/CSS-шаблоны длиннее лимита в 100 символов — разбивать их
# построчно только ради ruff не имеет смысла.
"fstec_lint/reporters/html.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
# Сигнатуры проверок и парсеров — часть контракта между YAML с правилами
# и кодом; без обязательных аннотаций mypy на этом проекте не проверял
# почти ничего.
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_unused_configs = true
strict_equality = true

# Стабы PyYAML ставятся из dev-зависимостей. Отдельная секция нужна,
# чтобы шаг CI не держался на --ignore-missing-imports: этот флаг не
# подавляет import-untyped, и любая среда без стабов роняла бы проверку.
[[tool.mypy.overrides]]
module = ["yaml", "yaml.*"]
ignore_missing_imports = true
